[project]
name = "music-transcription"
version = "0.1.0"
description = "自动音乐转录：调式、和弦、主旋律 → MIDI → 五线谱"
requires-python = ">=3.12"
dependencies = [
    # madmom 装不了声明式依赖（需要 --no-build-isolation + git main），
    # 安装步骤见 requirements-stage0.txt
    "numpy>=2.0",
    "scipy>=1.13",
    "mido>=1.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W=风格 F=错误 I=import排序 UP=语法现代化 B=常见bug
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行长交给 formatter 处理

[tool.ruff.format]
quote-style = "double"
