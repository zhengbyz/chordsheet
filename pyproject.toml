[project]
name = "music-transcription"
version = "0.1.0"
description = "自动音乐转录：调式、和弦、主旋律 → MIDI → 五线谱"
requires-python = ">=3.12"
dependencies = [
    # madmom 装不了声明式依赖（需要 --no-build-isolation + git main），
    # 安装步骤见 requirements-stage0.txt
    "numpy>=2.0",
    "scipy>=1.13",
    "mido>=1.2.8",
    "librosa>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]
# 真实标注评测用。指标定义（加权和弦召回率、节拍容差 F 值）都有公认标准，
# 自己实现容易在细节上偷偷放水，所以用领域标准库。
eval = [
    "mir_eval>=0.8",
]

[tool.pytest.ini_options]
# 让 tests/ 里能 import transcribe，不用装包也不用 sys.path 手脚
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W=风格 F=错误 I=import排序 UP=语法现代化 B=常见bug
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行长交给 formatter 处理

[tool.ruff.format]
quote-style = "double"
