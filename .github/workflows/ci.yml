name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 绝大多数单测是纯函数，只要 numpy。但有两组测试真的需要额外依赖：
      #   librosa —— fill_no_chord_cells 要算 chroma 才能给空拍补和弦
      #   mido    —— 验证写出的 MIDI 能被读回来、delta time 不为负
      # 这两组不能用 importorskip 打发过去：那样 CI 是绿的但测试根本没跑，
      # 比红着更危险。装上让它们真跑。
      #
      # madmom 仍然不装：它需要 --no-build-isolation 且只能从 git 主分支装，
      # 而没有任何单测会调用它（节拍与和弦识别的 import 都在函数内部懒加载）。
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest ruff librosa mido

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python -m pytest -q

      # 前端是单个 HTML，没有构建步骤也没有 node，所以自己抓最常犯的错：
      # 引用了不存在的函数、元素 id、对象成员。曾经因为一次字符串替换没匹配上
      # 而只剩调用点没有定义，界面静默失效、白查两轮。
      - name: Frontend static check
        run: python scripts/check_frontend.py
