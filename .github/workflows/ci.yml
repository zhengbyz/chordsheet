name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 单测只需要 numpy + pytest。madmom 和 librosa 的 import 都写在函数内部
      # 懒加载，所以 193 个纯函数单测不用装那两个重量级依赖——CI 因此只要几十秒，
      # 也不用在 CI 里重演 madmom 那套 --no-build-isolation 的安装折腾。
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python -m pytest -q
