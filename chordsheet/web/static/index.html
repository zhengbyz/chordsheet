<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chordsheet</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
  --line: #e3e0da; --accent: #c2410c; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --grid: #eeebe5; --grid-bar: #cfcac1; --grid-row: #f6f4f0;
  --key-white: #ffffff; --key-black: #2b2b2b; --note: #16a34a; --note-lit: #f97316;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #202024; --ink: #ececec; --muted: #9a9a9a;
    --line: #34343a; --accent: #fb923c; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --grid: #26262b; --grid-bar: #45454e; --grid-row: #1d1d21;
    --key-white: #d6d6d3; --key-black: #232327; --note: #4ade80; --note-lit: #fb923c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 26px 18px 60px; }
h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.02em; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 620; }

#drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: .15s; }
#drop:hover, #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
#drop strong { display: block; font-size: 17px; margin-bottom: 6px; }
#drop span { color: var(--muted); font-size: 13px; }
#file { display: none; }
.opts { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
.opts label { display: flex; gap: 6px; align-items: center; }
.opts input { width: 72px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }

#progress { display: none; }
.bar-outer { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 8px; }
.bar-inner { height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

#result { display: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
.stat .k { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.stat .v { font-size: 20px; font-weight: 620; letter-spacing: -.01em; }
.stat .n { font-size: 12px; color: var(--muted); margin-top: 3px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* ---- 音轨控制 ---- */
.trk { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.trk:last-child { border-bottom: 0; }
.trk label { display: flex; align-items: center; gap: 8px; min-width: 130px; font-weight: 560; cursor: pointer; }
.trk input[type=range] { flex: 1; max-width: 220px; accent-color: var(--accent); }
.trk .lv { font-size: 12px; color: var(--muted); min-width: 40px; }
.trk .tag { font-size: 12px; color: var(--muted); }

/* ---- 钢琴卷帘 ---- */
#roll { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: auto; height: 480px; background: var(--bg); }
#inner { position: relative; }
#keys { position: sticky; left: 0; top: 0; z-index: 3; width: 58px; }
#keys .k { position: absolute; left: 0; width: 58px; border-bottom: 1px solid var(--line); font-size: 9px; color: var(--muted); text-align: right; padding-right: 4px; line-height: 1; display: flex; align-items: center; justify-content: flex-end; }
#keys .k.w { background: var(--key-white); color: #555; }
#keys .k.b { background: var(--key-black); color: #bbb; width: 40px; z-index: 1; }
#grid { position: absolute; top: 0; }
.row { position: absolute; left: 0; height: 100%; }
.gl { position: absolute; top: 0; width: 1px; background: var(--grid); }
.gl.bar { background: var(--grid-bar); width: 1px; }
.note { position: absolute; background: var(--note); border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.note.lit { background: var(--note-lit); }
.strip { position: sticky; top: 0; z-index: 2; height: 26px; }
.chip { position: absolute; top: 0; height: 26px; display: flex; align-items: center; padding: 0 5px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; border-right: 1px solid var(--line); background: var(--panel); }
.chip.nd { color: var(--warn); }
.barnum { position: absolute; top: 26px; font-size: 9px; color: var(--muted); padding-left: 3px; z-index: 2; }
#ph { position: absolute; top: 0; width: 2px; background: var(--accent); z-index: 4; pointer-events: none; }
.tools { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.tools button { padding: 4px 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
.tools button:hover { border-color: var(--accent); }

audio { width: 100%; margin-top: 10px; }
.btn { display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-size: 14px; font-weight: 560; }
.btn:hover { filter: brightness(1.1); }
.note-txt { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
#err { color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>chordsheet</h1>
  <p class="sub">上传音频，识别调式、节拍与和弦。音频只在本机处理，不会上传到任何地方。</p>

  <div class="panel" id="upload-panel">
    <div id="drop">
      <strong>把音频拖到这里，或点击选择</strong>
      <span>支持 WAV / FLAC / MP3 / OGG　·　M4A 需先用 ffmpeg 转码</span>
    </div>
    <input type="file" id="file" accept=".wav,.flac,.mp3,.ogg,.aiff,.au">
    <div class="opts">
      <label>候选拍号 <input id="meters" value="3,4"></label>
      <label>最低 BPM <input id="minbpm" type="number" value="55"></label>
      <label>最高 BPM <input id="maxbpm" type="number" value="215"></label>
      <span>速度被判成一半时，把最低 BPM 调高再试</span>
    </div>
  </div>

  <div class="panel" id="progress">
    <div id="stage">准备中…</div>
    <div class="bar-outer"><div class="bar-inner" id="pbar"></div></div>
    <div class="note-txt" id="ptip">一首 4 分钟的歌约需 1-2 分钟（纯 CPU 推理）。</div>
    <div id="err"></div>
  </div>

  <div id="result">
    <div class="panel"><div class="stats" id="stats"></div><div class="note-txt" id="warnings"></div></div>

    <div class="panel">
      <h2>音轨</h2>
      <div class="trk">
        <label><input type="checkbox" id="t-song" checked> 原曲</label>
        <input type="range" id="v-song" min="0" max="100" value="100">
        <span class="lv" id="l-song">100%</span>
        <span class="tag">上传的音频</span>
      </div>
      <div class="trk">
        <label><input type="checkbox" id="t-chord"> 和弦</label>
        <input type="range" id="v-chord" min="0" max="100" value="45">
        <span class="lv" id="l-chord">45%</span>
        <span class="tag">按识别结果实时合成，勾上后和原曲一起放，用耳朵判断准不准</span>
      </div>
      <audio id="audio" controls preload="auto"></audio>
      <div style="margin-top:12px">
        <a id="midi-dl" class="btn" download>下载和弦 MIDI</a>
        <span class="note-txt" style="margin-left:10px">导出的是和弦构成音（根音·三音·五音），不是歌里实际弹的音符</span>
      </div>
    </div>

    <div class="panel">
      <h2>钢琴卷帘</h2>
      <div class="tools">
        <button id="zoom-out">横向 −</button><button id="zoom-in">横向 ＋</button>
        <button id="fit">回到音符区</button>
        <span id="roll-info"></span>
      </div>
      <div id="roll"><div id="inner">
        <div id="keys"></div><div id="grid"></div><div id="ph"></div>
      </div></div>
      <div class="note-txt">88 键，音块长度即和弦持续时间。点网格可跳转播放。</div>
    </div>
  </div>
</div>

<script>
const PC = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BLACK = [1,3,6,8,10];
const LOW = 21, HIGH = 108, KEYS = HIGH - LOW + 1;   // A0..C8，88 键
const KH = 11, GUTTER = 58;                          // 每键高度、左侧键盘宽度
const $ = id => document.getElementById(id);
let DATA=null, CELLS=[], BARLINES=[], NOTES=[], PPS=90;

const isBlack = p => BLACK.includes(((p % 12) + 12) % 12);
const yOf = p => (HIGH - p) * KH;                    // 高音在上
const prettyChord = l => !l || l === "N" ? "N.C." : l.replace(":maj","").replace(":min","m");
const noteName = p => PC[((p % 12) + 12) % 12] + (Math.floor(p / 12) - 1);

/* ---------- 上传 ---------- */
const drop = $("drop"), fileInput = $("file");
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };

async function upload(f) {
  $("upload-panel").style.display = "none"; $("result").style.display = "none";
  $("progress").style.display = "block"; $("err").textContent = ""; $("stage").textContent = "上传中…";
  const fd = new FormData(); fd.append("file", f);
  const qs = new URLSearchParams({ meters: $("meters").value || "3,4", min_bpm: $("minbpm").value || "55", max_bpm: $("maxbpm").value || "215" });
  let res;
  try { res = await fetch("/api/analyze?" + qs, { method: "POST", body: fd }); }
  catch (e) { return fail("无法连接本地服务：" + e.message); }
  if (!res.ok) { const t = await res.json().catch(() => ({})); return fail(t.detail || ("上传失败 HTTP " + res.status)); }
  poll((await res.json()).job_id);
}
function fail(m) { $("stage").textContent = "失败"; $("err").textContent = m; $("upload-panel").style.display = "block"; }
async function poll(id) {
  const tick = async () => {
    const s = await (await fetch("/api/status/" + id)).json();
    $("stage").textContent = s.stage; $("pbar").style.width = Math.round(s.progress * 100) + "%";
    if (s.error) return fail(s.error);
    if (s.done && s.result) { $("progress").style.display = "none"; render(s.result); return; }
    setTimeout(tick, 600);
  };
  tick();
}

/* ---------- 和弦试听：Web Audio 合成 ----------
   和 <audio> 的同步靠一次性对齐：播放开始时记下 audioContext 与 audio 各自的时钟，
   然后把所有音符按这个偏移排到未来。暂停或跳转就全部取消重排。
   逐音符提前调度比每帧轮询稳——浏览器的 requestAnimationFrame 会掉帧，
   而 Web Audio 的调度是采样级精确的。                                        */
const Synth = {
  ctx: null, gain: null, live: [], playing: false,
  ensure() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = +$("v-chord").value / 100 * 0.5;
    this.gain.connect(this.ctx.destination);
  },
  stop() {
    this.live.forEach(n => { try { n.stop(); } catch (e) {} });
    this.live = []; this.playing = false;
  },
  schedule(fromSec) {
    this.stop();
    if (!$("t-chord").checked || !NOTES.length) return;
    this.ensure();
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.06;   // 留一点调度余量
    this.playing = true;
    for (const n of NOTES) {
      if (n.end <= fromSec) continue;
      const start = t0 + Math.max(n.start - fromSec, 0);
      const end = t0 + (n.end - fromSec);
      const osc = this.ctx.createOscillator(), env = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 440 * Math.pow(2, (n.pitch - 69) / 12);
      // 简单 ADSR，避免爆音；低音稍响一点
      const peak = (n.velocity / 127) * (n.pitch < 48 ? 0.5 : 0.32);
      env.gain.setValueAtTime(0, start);
      env.gain.linearRampToValueAtTime(peak, start + 0.015);
      env.gain.exponentialRampToValueAtTime(peak * 0.55, start + 0.25);
      env.gain.setTargetAtTime(0.0001, Math.max(end - 0.08, start + 0.02), 0.04);
      osc.connect(env); env.connect(this.gain);
      osc.start(start); osc.stop(end + 0.12);
      this.live.push(osc);
    }
  },
};

/* ---------- 渲染 ---------- */
function render(d) {
  DATA = d; CELLS = d.chords.cells; BARLINES = d.chords.bar_lines; NOTES = d.notes || [];
  $("result").style.display = "block";
  $("audio").src = d.audio_url; $("midi-dl").href = d.midi_url;
  document.title = d.filename + " — chordsheet";

  const k = d.key, b = d.beats, c = d.chords;
  const pct = v => v === null || v === undefined ? "—" : Math.round(v * 100) + "%";
  const cls = (v, hi, mid) => v >= hi ? "ok" : v >= mid ? "warn" : "bad";
  $("stats").innerHTML = [
    ["调号（可靠）", k.signature.split("（")[0], k.signature.match(/（(.*)）/)?.[1] || "", ""],
    ["大小调（不可靠）", k.primary, k.agree ? "两套模板一致" : `另一模板说 ${k.alternative}`, k.agree ? "ok" : "warn"],
    ["速度", b.tempo.toFixed(1) + " BPM", b.agreement && b.agreement !== "一致" ? b.agreement : `${b.meter}/4　稳定性 ${b.stability.toFixed(3)}`, b.agreement && b.agreement !== "一致" ? "bad" : ""],
    ["小节内和弦纯度", pct(c.mean_coverage), c.ambiguous_bars.length + " 个小节混杂", cls(c.mean_coverage, .85, .7)],
    ["调内和弦占比", pct(c.diatonic_ratio), c.diatonic_ratio < .7 ? "调式或和弦有一环不对" : "和弦与调式互证", cls(c.diatonic_ratio ?? 0, .85, .7)],
    ["小节 / 和弦段", `${c.bar_lines.length} / ${CELLS.length}`, d.duration.toFixed(1) + " 秒", ""],
  ].map(([kk,v,n,cl]) => `<div class="stat"><div class="k">${kk}</div><div class="v ${cl}">${v}</div><div class="n">${n}</div></div>`).join("");

  const w = [];
  if (b.anacrusis_beats) w.push(`开头 ${b.anacrusis_beats} 拍（${b.uncovered_head.toFixed(2)}s）是弱起，已归入第 0 小节。`);
  if (b.agreement && b.agreement !== "一致") w.push(`速度存疑：${b.agreement}。倍速错误时拍点位置仍是对的，但小节会长一倍——调整上方 BPM 范围重试。`);
  if (c.diatonic_ratio !== null && c.diatonic_ratio < .7) w.push("调内和弦占比偏低。实测和弦比调式更可靠，若两者冲突，优先信和弦。");
  $("warnings").innerHTML = w.join("<br>");

  PPS = Math.max(28, Math.min(140, 900 / Math.max(DATA.duration, 1) * 6));
  buildRoll(); fitToNotes();
  requestAnimationFrame(loop);
}

function buildRoll() {
  const W = Math.max(DATA.duration * PPS, 200), H = KEYS * KH;
  $("inner").style.width = (GUTTER + W) + "px";
  $("inner").style.height = (H + 26) + "px";
  $("ph").style.height = (H + 26) + "px";

  // 左侧 88 键。黑键窄一点、压在白键上，形成常见的键盘轮廓。
  let keys = "";
  for (let p = HIGH; p >= LOW; p--) {
    const black = isBlack(p);
    keys += `<div class="k ${black ? "b" : "w"}" style="top:${yOf(p) + 26}px;height:${KH}px">`
          + (p % 12 === 0 ? noteName(p) : "") + `</div>`;
  }
  $("keys").style.height = (H + 26) + "px";
  $("keys").innerHTML = keys;

  const g = $("grid");
  g.style.left = GUTTER + "px"; g.style.width = W + "px"; g.style.height = (H + 26) + "px";

  let html = "";
  // 行底色：黑键行加深，读音高时有参照
  for (let p = HIGH; p >= LOW; p--) {
    if (isBlack(p)) html += `<div class="row" style="top:${yOf(p) + 26}px;height:${KH}px;width:${W}px;background:var(--grid-row)"></div>`;
  }
  // 拍线与小节线
  for (const t of DATA.beats.times) html += `<div class="gl" style="left:${t * PPS}px;height:${H + 26}px"></div>`;
  for (const b of BARLINES) html += `<div class="gl bar" style="left:${b.start * PPS}px;height:${H + 26}px"></div>`;
  // 顶部和弦条（sticky，横向跟着滚）
  html += `<div class="strip" style="width:${W}px">`;
  for (const c of CELLS) {
    const w = (c.end - c.start) * PPS;
    html += `<div class="chip${c.diatonic || c.chord === "N" ? "" : " nd"}" style="left:${c.start * PPS}px;width:${Math.max(w - 1, 2)}px"`
          + ` title="第 ${c.bar} 小节　${prettyChord(c.chord)}">${w > 30 ? prettyChord(c.chord) : ""}</div>`;
  }
  html += `</div>`;
  for (const b of BARLINES) html += `<div class="barnum" style="left:${b.start * PPS}px">${b.index}</div>`;
  // 音块
  NOTES.forEach((n, i) => {
    html += `<div class="note" data-i="${i}" style="left:${n.start * PPS}px;top:${yOf(n.pitch) + 26 + 1}px;`
          + `width:${Math.max((n.end - n.start) * PPS - 1, 2)}px;height:${KH - 2}px" title="${noteName(n.pitch)}"></div>`;
  });
  g.innerHTML = html;

  g.onclick = e => {
    const x = e.clientX - g.getBoundingClientRect().left;
    $("audio").currentTime = Math.max(x / PPS, 0);
    if (!$("audio").paused) Synth.schedule($("audio").currentTime);
  };
  $("roll-info").textContent = `${NOTES.length} 个音块　${(PPS).toFixed(0)} px/秒`;
}

function fitToNotes() {
  if (!NOTES.length) return;
  const lo = Math.min(...NOTES.map(n => n.pitch)), hi = Math.max(...NOTES.map(n => n.pitch));
  const mid = (yOf(hi) + yOf(lo)) / 2;
  $("roll").scrollTop = Math.max(mid - $("roll").clientHeight / 2 + 26, 0);
}

/* ---------- 播放同步 ---------- */
let lit = new Set();
function loop() {
  const a = $("audio"), t = a.currentTime;
  $("ph").style.left = (GUTTER + t * PPS) + "px";

  const now = new Set();
  NOTES.forEach((n, i) => { if (t >= n.start && t < n.end) now.add(i); });
  if (now.size !== lit.size || [...now].some(i => !lit.has(i))) {
    $("grid").querySelectorAll(".note").forEach(el => {
      el.classList.toggle("lit", now.has(+el.dataset.i));
    });
    lit = now;
  }
  if (!a.paused) {
    const sc = $("roll"), x = t * PPS;
    if (x < sc.scrollLeft || x > sc.scrollLeft + sc.clientWidth - GUTTER - 120) sc.scrollLeft = x - 150;
  }
  requestAnimationFrame(loop);
}

/* ---------- 音轨控制 ---------- */
$("t-song").onchange = () => { $("audio").muted = !$("t-song").checked; };
$("v-song").oninput = e => { $("audio").volume = e.target.value / 100; $("l-song").textContent = e.target.value + "%"; };
$("t-chord").onchange = () => {
  $("l-chord").textContent = $("v-chord").value + "%";
  if ($("t-chord").checked && !$("audio").paused) Synth.schedule($("audio").currentTime);
  else Synth.stop();
};
$("v-chord").oninput = e => {
  $("l-chord").textContent = e.target.value + "%";
  if (Synth.gain) Synth.gain.gain.value = e.target.value / 100 * 0.5;
};

const audio = $("audio");
audio.addEventListener("play", () => Synth.schedule(audio.currentTime));
audio.addEventListener("pause", () => Synth.stop());
audio.addEventListener("seeking", () => Synth.stop());
audio.addEventListener("seeked", () => { if (!audio.paused) Synth.schedule(audio.currentTime); });
audio.addEventListener("ratechange", () => { if (!audio.paused) Synth.schedule(audio.currentTime); });

$("zoom-in").onclick = () => { PPS = Math.min(PPS * 1.5, 600); buildRoll(); };
$("zoom-out").onclick = () => { PPS = Math.max(PPS / 1.5, 8); buildRoll(); };
$("fit").onclick = fitToNotes;
</script>
</body>
</html>
